title: 悦都全屋
views:
  - title: 悦都 · 全屋
    path: yuedu-home
    icon: mdi:home-variant-outline
    panel: true
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              # 悦都 · 全屋
              深圳 · 保利悦都　　{% set online = states | selectattr('state', 'ne', 'unavailable') | selectattr('state', 'ne', 'unknown') | list | count %}{{ online }} 个实体在线

          - type: picture-elements
            image: /local/yuedu-floorplan.png
            elements:
              - type: state-icon
                entity: climate.xiaomi_cn_2231050284_h69h00
                tap_action:
                  action: more-info
                style:
                  left: 32%
                  top: 31%
                  background: rgba(32, 91, 145, 0.92)
                  border-radius: 50%
                  padding: 12px
                  color: white
              - type: state-label
                entity: climate.xiaomi_cn_2231050284_h69h00
                attribute: current_temperature
                style:
                  left: 37%
                  top: 31%
                  background: rgba(18, 26, 34, 0.88)
                  color: white
                  border-radius: 0 16px 16px 0
                  padding: 7px 12px
                  font-weight: 600
              - type: state-icon
                entity: fan.xiaomi_cn_922697707_p51_s_2_fan
                tap_action:
                  action: more-info
                style:
                  left: 29%
                  top: 52%
                  background: rgba(36, 128, 132, 0.92)
                  border-radius: 50%
                  padding: 12px
                  color: white
              - type: state-icon
                entity: switch.chuangmi_cn_1143041027_069a01_on_p_2_1
                tap_action:
                  action: more-info
                style:
                  left: 53%
                  top: 68%
                  background: rgba(50, 58, 67, 0.92)
                  border-radius: 50%
                  padding: 12px
                  color: white
              - type: state-icon
                entity: sensor.xiaomi_cn_1193742494_s1_door_state_p_3_1021
                tap_action:
                  action: more-info
                style:
                  left: 75%
                  top: 80%
                  background: rgba(147, 104, 39, 0.94)
                  border-radius: 50%
                  padding: 12px
                  color: white
              - type: state-icon
                entity: sensor.mibx5_cn_2176693305_f94_status_p_2_2
                tap_action:
                  action: more-info
                style:
                  left: 13%
                  top: 75%
                  background: rgba(35, 121, 126, 0.92)
                  border-radius: 50%
                  padding: 12px
                  color: white

          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: climate.xiaomi_cn_2231050284_h69h00
                name: 卧室 A · 主卧空调
                state_content:
                  - state
                  - current_temperature
              - type: tile
                entity: fan.xiaomi_cn_922697707_p51_s_2_fan
                name: 卧室 A · 米家循环扇
              - type: tile
                entity: switch.chuangmi_cn_1143041027_069a01_on_p_2_1
                name: 客厅 · 小米智能摄像机 3
              - type: tile
                entity: switch.mibx5_cn_2176693305_f94_on_p_2_1
                name: 阳台 A · 洗衣机
                state_content:
                  - state
                  - last_changed

          - type: grid
            columns: 2
            square: false
            cards:
              - type: thermostat
                entity: climate.xiaomi_cn_2231050284_h69h00
                name: 卧室 A · 主卧空调
              - type: entities
                title: 客厅 · 智能门锁
                entities:
                  - entity: sensor.xiaomi_cn_1193742494_s1_door_state_p_3_1021
                    name: 大门状态
                  - entity: sensor.xiaomi_cn_1193742494_s1_battery_level_p_6_1003
                    name: 电池电量
                  - entity: sensor.xiaomi_cn_1193742494_s1_status_p_6_1004
                    name: 门锁状态

          - type: grid
            columns: 2
            square: false
            cards:
              - type: entities
                title: 客厅 · 摄像机控制
                entities:
                  - entity: switch.chuangmi_cn_1143041027_069a01_on_p_2_1
                    name: 摄像机开关
                  - entity: select.chuangmi_cn_1143041027_069a01_night_shot_p_2_3
                    name: 夜视
                  - entity: select.chuangmi_cn_1143041027_069a01_recording_mode_p_2_7
                    name: 录制模式
                  - entity: switch.chuangmi_cn_1143041027_069a01_motion_tracking_p_2_8
                    name: 移动追踪
              - type: entities
                title: 阳台 A · 洗衣机
                entities:
                  - entity: sensor.mibx5_cn_2176693305_f94_status_p_2_2
                    name: 工作状态
                  - entity: sensor.mibx5_cn_2176693305_f94_left_time_p_2_10
                    name: 剩余时间
                  - entity: sensor.mibx5_cn_2176693305_f94_door_state_p_2_9
                    name: 舱门状态
                  - entity: select.mibx5_cn_2176693305_f94_mode_p_2_3
                    name: 洗涤模式
                  - entity: select.mibx5_cn_2176693305_f94_target_temperature_p_2_5
                    name: 洗涤温度
                  - entity: select.mibx5_cn_2176693305_f94_spin_speed_p_2_7
                    name: 脱水转速

          - type: entities
            title: 卧室 A · 循环扇
            show_header_toggle: false
            entities:
              - entity: fan.xiaomi_cn_922697707_p51_s_2_fan
                name: 循环扇
              - entity: select.xiaomi_cn_922697707_p51_fan_level_a_p_2_2
                name: 挡位
              - entity: select.xiaomi_cn_922697707_p51_horizontal_swing_included_angle_p_2_5
                name: 左右摆风角度
