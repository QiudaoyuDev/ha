# 快捷模式只操作已确认存在且低风险的实体；不执行门锁远程动作。
yuedu_away_mode:
  alias: 悦都 · 离家模式
  icon: mdi:home-export-outline
  mode: single
  sequence:
    - action: fan.turn_off
      target:
        entity_id: fan.xiaomi_cn_922697707_p51_s_2_fan
    - action: switch.turn_on
      target:
        entity_id: switch.chuangmi_cn_1143041027_069a01_on_p_2_1
    - action: persistent_notification.create
      data:
        title: 悦都 · 离家模式
        message: 已关闭主卧循环扇并开启客厅摄像机；请在首页确认入户门锁状态。

yuedu_sleep_mode:
  alias: 悦都 · 睡眠模式
  icon: mdi:weather-night
  mode: single
  sequence:
    - action: fan.turn_off
      target:
        entity_id: fan.xiaomi_cn_922697707_p51_s_2_fan
    - action: persistent_notification.create
      data:
        title: 悦都 · 睡眠模式
        message: 已关闭主卧循环扇。空调温度与模式保留当前设置，避免覆盖家庭偏好。
