            days_to_show: 7
            compact_events_to_show: 5
            show_empty_days: true
            filter_duplicates: true
            split_multiday_events: true
            language: zh
            show_month: true
            show_week_numbers: iso
            show_countdown: true
            show_progress_bar: true
            tap_action: { action: expand }
            weather:
              entity: weather.wo_de_jia
