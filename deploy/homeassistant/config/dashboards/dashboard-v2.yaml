            date_pattern: yyyy年M月d日 cccc
            animated_icon: true
            weather_icon_type: line
            forecast_rows: 5
            show_humidity: true
            use_browser_time: false
          - type: weather-forecast
            entity: weather.wo_de_jia
            name: 逐小时天气
            show_current: false
            show_forecast: true
            forecast_type: hourly
            secondary_info_attribute: precipitation
            round_temperature: true
