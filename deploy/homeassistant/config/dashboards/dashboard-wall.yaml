# 悦都墙屏：横屏常驻总览。视频实体接入前，视频区保持明确离线态。
title: 悦都墙屏
views:
  - title: 家庭总览
    path: overview
    icon: mdi:home-variant-outline
    type: sections
    max_columns: 3
    theme: 悦都暖石
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: 悦都全屋
            subtitle: 家庭状态 · 空间入口 · 按需守护
          - type: picture-elements
            image: /local/floorplan/yuedu-home-2p5d.png
            elements:
              - type: state-label
                entity: sensor.yue_du_quan_wu_zhan_shi_zhuang_tai
                style: { left: 50%, top: 8%, color: '#3F3024', background: '#FFF9F1', border: '1px solid #DEC9B3', border-radius: 14px, padding: '8px 12px', font-size: '14px', font-weight: 700 }
              - type: icon
                icon: mdi:sofa-outline
                title: 客厅
                tap_action: { action: navigate, navigation_path: /yuedu-home/living }
                style: { left: 40%, top: 58%, color: '#167D7A', background: '#FFF9F1', border: '2px solid #167D7A', border-radius: 50%, padding: 10px }
              - type: icon
                icon: mdi:bed-king-outline
                title: 主卧
                tap_action: { action: navigate, navigation_path: /yuedu-home/master-bedroom }
                style: { left: 28%, top: 30%, color: '#167D7A', background: '#FFF9F1', border: '2px solid #167D7A', border-radius: 50%, padding: 10px }
              - type: icon
                icon: mdi:balcony
                title: 阳台
                tap_action: { action: navigate, navigation_path: /yuedu-home/balcony }
                style: { left: 13%, top: 76%, color: '#167D7A', background: '#FFF9F1', border: '2px solid #167D7A', border-radius: 50%, padding: 10px }
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: 现在的家
            subtitle: 只显示可解释、可执行的状态
          - type: custom:mushroom-template-card
            entity: sensor.yue_du_men_suo_zhan_shi_zhuang_tai
            primary: 入户安全
            secondary: "{{ states(entity) }}"
            icon: mdi:door-closed-lock
            icon_color: amber
            tap_action: { action: more-info }
          - type: custom:mushroom-template-card
            entity: sensor.yue_du_kong_diao_zhan_shi_zhuang_tai
            primary: 主卧舒适
            secondary: "{{ states(entity) }}"
            icon: mdi:air-conditioner
            icon_color: blue
            tap_action: { action: navigate, navigation_path: /yuedu-home/master-bedroom }
          - type: custom:mushroom-template-card
            entity: sensor.yue_du_xi_yi_ji_zhan_shi_zhuang_tai
            primary: 阳台任务
            secondary: "{{ states(entity) }}"
            icon: mdi:washing-machine
            icon_color: teal
            tap_action: { action: navigate, navigation_path: /yuedu-home/balcony }
          - type: custom:mushroom-template-card
            primary: 快捷模式
            secondary: 离家与睡眠模式均需确认；进入主控页执行
            icon: mdi:home-clock-outline
            icon_color: amber
            tap_action: { action: navigate, navigation_path: /yuedu-home/home }
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: 客厅守护
            subtitle: 按需播放 · 静音 · 不录像
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.yue_du_ke_ting_shi_shi_liu_zhuang_tai
                state: 实时流可用
            card:
              type: picture-entity
              entity: camera.yuedu_living_camera
              camera_view: auto
              show_name: false
              show_state: false
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.yue_du_ke_ting_shi_shi_liu_zhuang_tai
                state_not: 实时流可用
            card:
              type: custom:mushroom-template-card
              primary: 客厅实时画面暂不可用
              secondary: 设备离线，正在等待米家连接；接入 RTSP 后触碰此区域播放。
              icon: mdi:video-off-outline
              icon_color: amber
              multiline_secondary: true
          - type: custom:mushroom-template-card
            entity: sensor.yue_du_she_xiang_ji_zhan_shi_zhuang_tai
            primary: 摄像机状态
            secondary: "{{ states(entity) }}"
            icon: mdi:cctv
            icon_color: teal
            tap_action: { action: navigate, navigation_path: /yuedu-home/home#yuedu-living-camera }
