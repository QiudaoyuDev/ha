
# Loads default set of integrations. Do not remove.
default_config:

# 摄像机桥接为可选依赖：桥接未启动时只显示离线语义，不伪造视频。
go2rtc:
  url: http://host.docker.internal:1984

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# UI only consumes these semantic, Chinese display states.  Integration values
# remain untouched and can still be inspected from Developer Tools.
template: !include templates/yuedu_ui.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Dedicated native dashboard for the YueDu apartment floor plan.
lovelace:
  dashboards:
    yuedu-home:
      mode: yaml
      title: 悦都全屋
      icon: mdi:home-variant-outline
      show_in_sidebar: true
      require_admin: false
      filename: dashboards/dashboard-v2.yaml
    yuedu-wall:
      mode: yaml
      title: 悦都墙屏
      icon: mdi:tablet-dashboard
      show_in_sidebar: false
      require_admin: false
      filename: dashboards/dashboard-wall.yaml


# Apple Home / Siri bridge for the safe YueDu device subset.
homekit: !include homekit.yaml
