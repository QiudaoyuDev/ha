services:
  homeassistant:
    container_name: homeassistant-local
    image: ghcr.io/home-assistant/home-assistant:stable
    # Web UI 通过发布端口从 Windows 访问；HomeKit mDNS 在 WSL 镜像网络下由宿主机处理。
    ports:
      - "8123:8123"
    extra_hosts:
      # HA 容器通过此别名访问同机 host-network 的 go2rtc。
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/config
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
