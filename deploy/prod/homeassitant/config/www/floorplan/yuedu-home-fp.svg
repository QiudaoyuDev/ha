<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid meet">
  <style>
    .fp-marker { cursor: pointer; }
    .fp-off { fill: #9AA0A6 !important; opacity: 0.5; }
    .fp-label { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 30px; fill: #FFF9F1; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  </style>

  <!-- 主卧空调 -->
  <g class="fp-marker" id="fp-ac">
    <circle cx="445" cy="317" r="30" fill="#167D7A" fill-opacity="0.95"/>
    <text class="fp-label" x="445" y="317">&#10052;</text>
    <title>主卧空调</title>
  </g>

  <!-- 主卧循环扇 -->
  <g class="fp-marker" id="fp-fan">
    <circle cx="584" cy="399" r="30" fill="#167D7A" fill-opacity="0.95"/>
    <text class="fp-label" x="584" y="399">&#127788;</text>
    <title>循环扇</title>
  </g>

  <!-- 客厅摄像机 -->
  <g class="fp-marker" id="fp-cam">
    <circle cx="584" cy="584" r="30" fill="#323A43" fill-opacity="0.95"/>
    <text class="fp-label" x="584" y="584">&#128247;</text>
    <title>客厅摄像机</title>
  </g>

  <!-- 入户门锁（只读） -->
  <g class="fp-marker" id="fp-lock">
    <circle cx="1121" cy="809" r="30" fill="#B7791F" fill-opacity="0.96"/>
    <text class="fp-label" x="1121" y="809">&#128274;</text>
    <title>入户门锁</title>
  </g>

  <!-- 阳台洗衣机 -->
  <g class="fp-marker" id="fp-wash">
    <circle cx="169" cy="748" r="30" fill="#23797E" fill-opacity="0.95"/>
    <text class="fp-label" x="169" y="748">&#129689;</text>
    <title>阳台洗衣机</title>
  </g>
</svg>
