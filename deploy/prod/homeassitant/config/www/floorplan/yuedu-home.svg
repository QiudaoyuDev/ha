<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid meet">
  <!-- U3：2.5D 底图作为背景，设备标记由 Home Assistant 实体驱动 -->
  <image x="0" y="0" width="1536" height="1024"
         xlink:href="/local/floorplan/yuedu-home-2p5d.png" preserveAspectRatio="none"/>

  <!-- 主卧空调 -->
  <circle cx="445" cy="317" r="26" fill="#167D7A" fill-opacity="0.92"/>
  <ha-state-icon entity="sensor.yue_du_kong_diao_zhan_shi_zhuang_tai"
                 x="419" y="291" width="52" height="52"
                 style="color:#FFF9F1" on-tap="navigate:#yuedu-master-climate"/>

  <!-- 主卧循环扇 -->
  <circle cx="584" cy="399" r="26" fill="#167D7A" fill-opacity="0.92"/>
  <ha-state-icon entity="sensor.yue_du_xun_huan_shan_zhan_shi_zhuang_tai"
                 x="558" y="373" width="52" height="52"
                 style="color:#FFF9F1" on-tap="navigate:#yuedu-master-climate"/>

  <!-- 客厅摄像机 -->
  <circle cx="584" cy="584" r="26" fill="#323A43" fill-opacity="0.92"/>
  <ha-state-icon entity="sensor.yue_du_she_xiang_ji_zhan_shi_zhuang_tai"
                 x="558" y="558" width="52" height="52"
                 style="color:#FFF9F1" on-tap="navigate:#yuedu-living-camera"/>

  <!-- 入户门锁（只读，不提供远程开锁） -->
  <circle cx="1121" cy="809" r="26" fill="#B7791F" fill-opacity="0.94"/>
  <ha-state-icon entity="sensor.yue_du_men_suo_zhan_shi_zhuang_tai"
                 x="1095" y="783" width="52" height="52"
                 style="color:#FFF9F1" on-tap="navigate:#yuedu-living-lock"/>

  <!-- 阳台洗衣机 -->
  <circle cx="169" cy="748" r="26" fill="#23797E" fill-opacity="0.92"/>
  <ha-state-icon entity="sensor.yue_du_xi_yi_ji_zhan_shi_zhuang_tai"
                 x="143" y="722" width="52" height="52"
                 style="color:#FFF9F1" on-tap="navigate:#yuedu-balcony-washer"/>
</svg>
