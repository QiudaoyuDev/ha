# 悦都暖石：固定白昼主题。它刻意不定义 dark mode，避免手机系统深色模式
# 将 2.5D 木色空间带入黑灰背景。
悦都暖石:
  primary-color: "#87593B"
  accent-color: "#167D7A"
  primary-background-color: "#F1E7DA"
  secondary-background-color: "#E9DDCF"
  card-background-color: "#FFF9F1"
  primary-text-color: "#3F3024"
  secondary-text-color: "#75675A"
  divider-color: "#DEC9B3"
  app-header-background-color: "#F7F1E7"
  app-header-text-color: "#3F3024"
  sidebar-background-color: "#EEE1D2"
  sidebar-text-color: "#4D4035"
  sidebar-selected-background-color: "#E7D1B8"
  sidebar-selected-text-color: "#694226"
  # V3：更轻的卡片层级，让户型和设备状态成为视觉焦点。
  ha-card-background: "rgba(255, 249, 241, 0.95)"
  ha-card-border-radius: "20px"
  ha-card-box-shadow: "0 8px 24px rgba(96, 67, 40, 0.08)"
  ha-card-border-width: "1px"
  ha-card-border-color: "#DEC9B3"
  state-icon-color: "#897D70"
  state-icon-active-color: "#167D7A"
  success-color: "#167D7A"
  warning-color: "#B7791F"
  error-color: "#B54A41"
  lovelace-background: "radial-gradient(circle at 8% 0%, #F7F1E7 0, #F1E7DA 44%, #E9DDCF 100%)"
  masonry-view-card-margin: "10px"
