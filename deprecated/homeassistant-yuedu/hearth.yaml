                attrs:
                  type: text
                  name: 洗衣机标签
                  text: 洗衣机
                  x: 96
                  y: 240
                  fontSize: 13
                  fill: '#ffffff'
                  fontFamily: Inter Variable
                  fontStyle: bold
                  draggable: false
                  visible: true
        - id: home-climate
          type: climate
          title: 卧室 A · 主卧空调
          entity: climate.xiaomi_cn_2231050284_h69h00
        - id: home-fan
          type: entities
          title: 卧室 A · 循环扇
          show_count: true
          entities:
            - entity: fan.xiaomi_cn_922697707_p51_s_2_fan
              name: 米家循环扇
              icon: mode_fan
            - entity: select.xiaomi_cn_922697707_p51_fan_level_a_p_2_2
              name: 风速挡位
              icon: speed
      -
        - id: home-security
          type: entities
          title: 客厅 · 入户安全
          entities:
            - entity: sensor.xiaomi_cn_1193742494_s1_door_state_p_3_1021
              name: 大门状态
              icon: door_front
            - entity: sensor.xiaomi_cn_1193742494_s1_battery_level_p_6_1003
              name: 门锁电量
              icon: battery_full
        - id: home-camera
          type: entities
          title: 客厅 · 小米智能摄像机 3
          entities:
            - entity: switch.chuangmi_cn_1143041027_069a01_on_p_2_1
              name: 摄像机开关
              icon: videocam
            - entity: switch.chuangmi_cn_1143041027_069a01_motion_tracking_p_2_8
              name: 移动追踪
              icon: track_changes
        - id: home-washer
          type: entities
          title: 阳台 A · 洗衣机
          entities:
            - entity: sensor.mibx5_cn_2176693305_f94_status_p_2_2
              name: 工作状态
              icon: local_laundry_service
            - entity: sensor.mibx5_cn_2176693305_f94_left_time_p_2_10
              name: 剩余时间
              icon: timer

  - id: bedroom-a
    name: 卧室 A
    icon: bed
    summary: 空调与循环扇
    columns: 2
    cards:
      -
        - id: bedroom-climate
          type: climate
          title: 主卧空调
          entity: climate.xiaomi_cn_2231050284_h69h00
      -
        - id: bedroom-fan
          type: entities
          title: 米家循环扇
          entities:
            - entity: fan.xiaomi_cn_922697707_p51_s_2_fan
              name: 开关
            - entity: select.xiaomi_cn_922697707_p51_fan_level_a_p_2_2
              name: 挡位
            - entity: select.xiaomi_cn_922697707_p51_horizontal_swing_included_angle_p_2_5
              name: 左右摆风

  - id: living
    name: 客厅
    icon: weekend
    summary: 摄像机与入户门锁
    columns: 2
    cards:
      -
        - id: living-camera
          type: entities
          title: 小米智能摄像机 3 云台版
          entities:
            - entity: switch.chuangmi_cn_1143041027_069a01_on_p_2_1
              name: 摄像机开关
            - entity: select.chuangmi_cn_1143041027_069a01_night_shot_p_2_3
              name: 夜视
            - entity: select.chuangmi_cn_1143041027_069a01_recording_mode_p_2_7
              name: 录制模式
            - entity: switch.chuangmi_cn_1143041027_069a01_motion_tracking_p_2_8
              name: 移动追踪
      -
        - id: living-lock
          type: entities
          title: 入户智能门锁
          entities:
            - entity: sensor.xiaomi_cn_1193742494_s1_door_state_p_3_1021
              name: 大门状态
              icon: door_front
            - entity: sensor.xiaomi_cn_1193742494_s1_status_p_6_1004
              name: 门锁状态
              icon: lock
            - entity: sensor.xiaomi_cn_1193742494_s1_battery_level_p_6_1003
              name: 电池电量
              icon: battery_full

  - id: balcony-a
    name: 阳台 A
    icon: local_laundry_service
    summary: 洗衣与烘干
    columns: 2
    cards:
      -
        - id: washer-controls
          type: entities
          title: 洗衣机
          entities:
            - entity: switch.mibx5_cn_2176693305_f94_on_p_2_1
              name: 电源
            - entity: sensor.mibx5_cn_2176693305_f94_status_p_2_2
              name: 工作状态
            - entity: sensor.mibx5_cn_2176693305_f94_left_time_p_2_10
              name: 剩余时间
            - entity: sensor.mibx5_cn_2176693305_f94_door_state_p_2_9
              name: 舱门状态
      -
        - id: washer-program
          type: entities
          title: 洗涤程序
          entities:
            - entity: select.mibx5_cn_2176693305_f94_mode_p_2_3
              name: 模式
            - entity: select.mibx5_cn_2176693305_f94_target_temperature_p_2_5
              name: 温度
            - entity: select.mibx5_cn_2176693305_f94_spin_speed_p_2_7
              name: 脱水转速

  - id: bedroom-b
    name: 卧室 B
    icon: bed
    summary: 暂无已接入设备
    cards:
      -
        - id: bedroom-b-header
          type: header
          title: 卧室 B
          subtitle: 后续接入设备会显示在这里
          icon: bed

  - id: kitchen
