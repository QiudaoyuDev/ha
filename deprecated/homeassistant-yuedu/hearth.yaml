rail:
  - id: clock
    type: clock
    city: Shenzhen
  - id: nav
    type: nav
  - id: washer-progress
    type: progress
    name: 阳台洗衣
    icon: local_laundry_service
    status_entity: sensor.mibx5_cn_2176693305_f94_status_p_2_2
    remaining_entity: sensor.mibx5_cn_2176693305_f94_left_time_p_2_10
  - id: spacer
    type: spacer
  - id: status
    type: status
    icon: home
    text: 保利悦都

rooms:
  - id: home
    name: 悦都 · 全屋
    icon: home
    summary: 深圳 · 保利悦都
    columns: 2
    cards:
      -
        - id: home-header
          type: header
          title: 悦都 · 全屋
          subtitle: 深圳 · 保利悦都
          icon: home
        - id: home-floorplan
          type: fusion
          height: 350
          config:
            type: picture_elements
            elements:
              - className: Image
                attrs:
                  type: image
                  name: Floor plan
                  x: 0
                  y: 0
                  width: 470
                  height: 337
                  scaleX: 1
                  scaleY: 1
                  rotation: 0
                  opacity: 1
                  draggable: false
                  listening: false
                  visible: true
                  src: /local/yuedu-floorplan.png
              - className: Image
                attrs:
                  type: state-icon
                  name: 主卧空调
                  entity_id: climate.xiaomi_cn_2231050284_h69h00
                  x: 174
                  y: 92
                  width: 34
                  height: 34
                  color: '#56b6ff'
                  draggable: false
                  visible: true
              - className: Text
                attrs:
                  type: text
                  name: 空调标签
                  text: 主卧空调
                  x: 208
                  y: 101
                  fontSize: 13
                  fill: '#ffffff'
                  fontFamily: Inter Variable
                  fontStyle: bold
                  draggable: false
                  visible: true
              - className: Image
                attrs:
                  type: state-icon
                  name: 循环扇
                  entity_id: fan.xiaomi_cn_922697707_p51_s_2_fan
                  x: 163
                  y: 133
                  width: 34
                  height: 34
                  color: '#5ed7cb'
                  draggable: false
                  visible: true
              - className: Text
                attrs:
                  type: text
                  name: 风扇标签
                  text: 循环扇
                  x: 197
                  y: 142
                  fontSize: 13
                  fill: '#ffffff'
                  fontFamily: Inter Variable
                  fontStyle: bold
                  draggable: false
                  visible: true
              - className: Image
                attrs:
                  type: state-icon
                  name: 摄像机
                  entity_id: switch.chuangmi_cn_1143041027_069a01_on_p_2_1
                  x: 252
                  y: 205
                  width: 34
                  height: 34
                  color: '#f5f5f5'
                  draggable: false
                  visible: true
              - className: Text
                attrs:
                  type: text
                  name: 摄像机标签
