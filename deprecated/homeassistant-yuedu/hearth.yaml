                  x: 286
                  y: 214
                  fontSize: 13
                  fill: '#ffffff'
                  fontFamily: Inter Variable
                  fontStyle: bold
                  draggable: false
                  visible: true
              - className: Image
                attrs:
                  type: state-icon
                  name: 门锁
