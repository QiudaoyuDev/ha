                attrs:
                  type: text
                  name: 门锁标签
                  text: 门锁
                  x: 368
                  y: 279
                  fontSize: 13
                  fill: '#ffffff'
                  fontFamily: Inter Variable
                  fontStyle: bold
                  draggable: false
                  visible: true
              - className: Image
                attrs:
                  type: state-icon
                  name: 洗衣机
                  entity_id: sensor.mibx5_cn_2176693305_f94_status_p_2_2
                  x: 62
                  y: 231
                  width: 34
                  height: 34
                  color: '#54c7d2'
                  draggable: false
                  visible: true
